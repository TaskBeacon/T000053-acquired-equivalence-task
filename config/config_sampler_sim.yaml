# ============================================================================
# Base config (sampler sim run)
# - Used by: python main.py sim
# - Scope: sim-mode only
# ============================================================================

# === Subject Form ===========================================================
subinfo_fields:
  - name: subject_id
    type: int
    constraints:
      min: 101
      max: 999
      digits: 3

subinfo_mapping:
  subject_id: Subject ID (3 digits)
  Participant Information: Participant Information
  registration_failed: Registration failed
  registration_successful: Registration successful
  invalid_input: "Invalid input for {field}"


# === Display / Window =======================================================
window:
  size: [1280, 720]
  units: pix
  screen: 0
  bg_color: black
  fullscreen: false
  monitor_width_cm: 35.5
  monitor_distance_cm: 60


# === Task ===================================================================
task:
  task_name: Acquired Equivalence Task
  save_path: ./outputs/sim_sampler
  total_blocks: 4
  total_trials: 48
  trial_per_block: 12
  conditions:
    - stage1_training
    - stage2_training
    - stage3_training
    - transfer_test
  condition_weights: null
  key_list: [space, z, m]
  response_keys: [z, m]
  left_key: z
  right_key: m
  continue_key: space
  face_assets:
    A1: face_A1
    A2: face_A2
    B1: face_B1
    B2: face_B2
  fish_assets:
    X1: fish_X1
    X2: fish_X2
    Y1: fish_Y1
    Y2: fish_Y2
  stage_required_consecutive_correct:
    stage1_training: 1
    stage2_training: 1
    stage3_training: 1
  block_repeat_limit: 1
  seed_mode: same_across_sub
  overall_seed: 53053
  delta: 0.0
  language: English
  voice_name: en-US-AriaNeural
  voice_enabled: false
  input_mode: keyboard
  hide_cursor: true
  force_quit_enabled: true
  force_quit_shortcut: ctrl+q
  enable_logging: true


# === Timing =================================================================
timing:
  post_delay_ms: 1


# === Stimuli ================================================================
stimuli:
  instruction_text:
    type: text
    text: |
      Acquired Equivalence Task

      You will learn which fish goes with each face.
      Some faces belong to the same hidden groups, so learning one face can help with another face from the same group.
      Use Z for the left fish and M for the right fish.
      Training stages give feedback after every choice.
      The final transfer test has no feedback.

      Press SPACE to begin.
    font: Arial
    color: white
    height: 26
    wrapWidth: 1080
    pos: [0, 10]

  training_block_intro_text:
    type: text
    text: |
      {block_label}

      This block has {trial_count} trials.
      You need {required_consecutive_correct} consecutive correct responses to move on.

      Press SPACE to start.
    font: Arial
    color: white
    height: 28
    wrapWidth: 1040
    pos: [0, 0]

  test_block_intro_text:
    type: text
    text: |
      {block_label}

      This block has {trial_count} transfer trials.
      No feedback will be shown in the transfer test.

      Press SPACE to start.
    font: Arial
    color: white
    height: 28
    wrapWidth: 1040
    pos: [0, 0]

  choice_prompt_text:
    type: text
    text: "Choose the fish that goes with this face."
    font: Arial
    color: white
    height: 24
    wrapWidth: 980
    pos: [0, -250]

  fixation:
    type: text
    text: "+"
    font: Arial
    color: white
    height: 54
    pos: [0, 0]

  training_feedback_correct:
    type: text
    text: "Correct"
    font: Arial
    color: "#4CAF50"
    height: 36
    pos: [0, 0]

  training_feedback_incorrect:
    type: text
    text: "Incorrect"
    font: Arial
    color: "#E53935"
    height: 36
    pos: [0, 0]

  training_feedback_timeout:
    type: text
    text: "Too slow"
    font: Arial
    color: "#FDD835"
    height: 36
    pos: [0, 0]

  block_summary_text:
    type: text
    text: |
      {block_label}

      Current streak: {current_streak}/{required_consecutive_correct}
      Block accuracy: {accuracy_pct}
      Pair accuracy:
      {pair_accuracy_lines}

      {repeat_message}

      Press SPACE to advance.
    font: Arial
    color: white
    height: 24
    wrapWidth: 1040
    pos: [0, 0]

  good_bye_text:
    type: text
    text: |
      Transfer test complete

      Overall accuracy: {overall_accuracy_pct}
      Mean correct RT: {mean_correct_rt_ms}
      Timeouts: {timeout_count}

      Press SPACE to finish.
    font: Arial
    color: white
    height: 26
    wrapWidth: 1040
    pos: [0, 0]

  face_A1:
    type: image
    image: ./assets/face_A1.png
    size: [220, 220]
    pos: [0, 140]

  face_A2:
    type: image
    image: ./assets/face_A2.png
    size: [220, 220]
    pos: [0, 140]

  face_B1:
    type: image
    image: ./assets/face_B1.png
    size: [220, 220]
    pos: [0, 140]

  face_B2:
    type: image
    image: ./assets/face_B2.png
    size: [220, 220]
    pos: [0, 140]

  fish_X1_left:
    type: image
    image: ./assets/fish_X1.png
    size: [220, 220]
    pos: [-270, -120]

  fish_X1_right:
    type: image
    image: ./assets/fish_X1.png
    size: [220, 220]
    pos: [270, -120]

  fish_X2_left:
    type: image
    image: ./assets/fish_X2.png
    size: [220, 220]
    pos: [-270, -120]

  fish_X2_right:
    type: image
    image: ./assets/fish_X2.png
    size: [220, 220]
    pos: [270, -120]

  fish_Y1_left:
    type: image
    image: ./assets/fish_Y1.png
    size: [220, 220]
    pos: [-270, -120]

  fish_Y1_right:
    type: image
    image: ./assets/fish_Y1.png
    size: [220, 220]
    pos: [270, -120]

  fish_Y2_left:
    type: image
    image: ./assets/fish_Y2.png
    size: [220, 220]
    pos: [-270, -120]

  fish_Y2_right:
    type: image
    image: ./assets/fish_Y2.png
    size: [220, 220]
    pos: [270, -120]


# === Triggers ===============================================================
triggers:
  map:
    exp_onset: 1
    exp_end: 2
    block_onset: 10
    block_end: 11
    instruction_onset: 12
    trial_fixation_onset: 20
    choice_onset: 21
    response_z: 31
    response_m: 32
    trial_timeout: 33
    feedback_onset: 34
    trial_iti_onset: 35
    good_bye_onset: 40
  driver:
    type: serial_url
    url: loop://
    baudrate: 115200
  timing:
    post_delay_ms: 1
  policy:
    strict: false


# === Simulation =============================================================
sim:
  output_dir: outputs/sim_sampler
  seed: 53053
  participant_id: sim001
  session_id: sub-sim001_task-acquired_equivalence_task_seed53053_sampler
  log_path: outputs/sim_sampler/sub-sim001_task-acquired_equivalence_task_seed53053_sampler_sim_events.jsonl
  policy: warn
  default_rt_s: 0.2
  clamp_rt: false
  responder:
    type: responders.task_sampler:TaskSamplerResponder
    kwargs:
      key: null
      stage1_hit_rate: 0.99
      stage2_hit_rate: 0.97
      stage3_hit_rate: 0.95
      transfer_hit_rate: 0.88
      timeout_rate: 0.02
      rt_mean_s: 0.92
      rt_sd_s: 0.22
      rt_min_s: 0.18
      continue_rt_s: 0.5
