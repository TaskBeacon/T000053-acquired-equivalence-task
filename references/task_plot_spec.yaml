task_plot_spec:
  spec_version: '0.2'
  meta:
    task_name: Acquired Equivalence Task
    mode: existing
    task_id: T000053
  figure:
    output:
      filename: task_flow.png
      dpi: 300
      width_in: 16.0
      background: white
      auto_width: false
    layout:
      max_conditions: 4
      screens_per_timeline: 4
      screen_overlap_ratio: 0.1
      screen_slope: 0.08
      screen_slope_deg: 25.0
      timeline_gap: 0.18
      screen_aspect_ratio: 1.4545454545454546
      left_margin: 0.2
      right_margin: 0.03
      top_margin: 0.03
      bottom_margin: 0.05
      condition_label_gap: 0.014
      phase_label_pad: 0.01
      duration_label_gap: 0.006
      timeline_arrow_gap: 0.01
      timeline_arrow_screen_clearance: 0.007
      timeline_arrow_text_clearance: 0.01
      timeline_arrow_extra_per_screen: 0.015
      timeline_arrow_min_y: 0.02
      timeline_arrow_max_y: 0.96
  timelines:
  - condition: stage1_training
    display_condition_label: Stage 1 Training
    display_condition_note: Initial learning; 8 correct criterion.
    phases:
    - phase_name: fixation
      display_phase_label: Fixation
      duration_ms:
        fixed: 400
      response_window_ms: null
      display_timing_label: 400 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos:
          - 0.0
          - 0.0
          height: 54.0
      notes: ''
    - phase_name: choice
      display_phase_label: Choice
      duration_ms:
        fixed: 3000
      response_window_ms:
        fixed: 3000
      display_timing_label: Resp 3 s
      stim_ids:
      - face_A1
      - fish_X1_left
      - fish_Y1_right
      - choice_prompt_text
      stimulus_example:
        summary: Face A1 + fish X1/Y1 choices
        modality: visual
        draw_hint: image_ref
        render_items:
        - kind: image_ref
          path: E:\Taskbeacon\T000053-acquired-equivalence-task\references\plot_assets\choice_stage1.png
          label: Stage 1 choice display
      notes: Representative choice layout for the stage; left/right order is randomized
        at runtime.
    - phase_name: feedback
      display_phase_label: Feedback
      duration_ms:
        fixed: 800
      response_window_ms: null
      display_timing_label: 800 ms
      stim_ids:
      - training_feedback_incorrect
      stimulus_example:
        summary: Incorrect
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: Incorrect
          color: '#E53935'
          pos:
          - 0.0
          - 0.0
          height: 36.0
      notes: Shown only on training stages.
    - phase_name: iti
      display_phase_label: ITI
      duration_ms:
        fixed: 400
      response_window_ms: null
      display_timing_label: 400 ms
      stim_ids:
      - fixation
